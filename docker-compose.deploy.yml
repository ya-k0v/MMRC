services:
  mmrc:
    image: ${DOCKER_IMAGE:-pingwin1900/mmrc}:${DOCKER_IMAGE_TAG:-v340}
    container_name: mmrc
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-12h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SILENT_CONSOLE=${SILENT_CONSOLE:-false}
      - MMRC_DATA_DIR=/app/data
      - CONTENT_ROOT=/app/data
      - STREAMS_OUTPUT_DIR=/app/data/streams
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
      - CONVERTER_IMAGE=${CONVERTER_IMAGE:-pingwin1900/mmrc-converter}
      - FFMPEG_IMAGE=${FFMPEG_IMAGE:-pingwin1900/mmrc-ffmpeg}
      - LOGS_DIR=/app/data/logs
      - WAL_CHECKPOINT_INTERVAL_MS=${WAL_CHECKPOINT_INTERVAL_MS:-300000}
      - NIGHT_OPT_START_HOUR=${NIGHT_OPT_START_HOUR:-1}
      - NIGHT_OPT_END_HOUR=${NIGHT_OPT_END_HOUR:-5}
      - JOB_RESERVE_CPU_PERCENT=${JOB_RESERVE_CPU_PERCENT:-30}
      - JOB_RESERVE_MEMORY_MB=${JOB_RESERVE_MEMORY_MB:-2048}
      - STREAM_MAX_JOBS=${STREAM_MAX_JOBS:-100}
      - STREAM_IDLE_TIMEOUT_MS=${STREAM_IDLE_TIMEOUT_MS:-180000}
      - LDAP_URL=${LDAP_URL:-ldap://disabled}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-cn=admin,dc=disabled}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:-dc=disabled}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-mmrc-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-mmrc}
      - DB_USER=${DB_USER:-mmrc}
      - DB_PASSWORD=${DB_PASSWORD:-mmrc}
      # Docker update manager (вкл in-app проверку обновлений)
      - MMRC_DOCKER=1
      - MMRC_COMPOSE_DIR=/host
      - DOCKER_IMAGE=${DOCKER_IMAGE:-pingwin1900/mmrc}
      - DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG:-v340}
      - REDIS_URL=${REDIS_URL:-redis://mmrc-redis:6379}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://mmrc-minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mmrc}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${CONTENT_DIR:-./data}:/app/data
      - mmrc-config:/app/config
      - mmrc-temp:/app/.tmp
      - mmrc-certs:/etc/nginx/ssl-certs:ro
      # Docker socket — для авто-обновления из админки. Удалите, если не нужно.
      - /var/run/docker.sock:/var/run/docker.sock
      # Project dir — для доступа к compose-файлу при обновлении.
      - .:/host:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      mmrc-network:
        aliases:
          - mmrc-server

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    container_name: mmrc-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-mmrc}
      - POSTGRES_USER=${DB_USER:-mmrc}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mmrc}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - mmrc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mmrc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mmrc-network

  streamer:
    image: ${STREAMER_IMAGE:-pingwin1900/mmrc-streamer}:${DOCKER_IMAGE_TAG:-v340}
    profiles: [streamer]
    container_name: mmrc-streamer
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
    volumes:
      - ${CONTENT_DIR:-./data}:/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      mmrc-network:
        aliases:
          - mmrc-streamer

  redis:
    image: redis:7-alpine
    container_name: mmrc-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mmrc-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mmrc-network

  minio:
    image: minio/minio:latest
    profiles: [s3]
    container_name: mmrc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${CONTENT_DIR:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "mc alias set l http://localhost:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready l >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mmrc-network

  mmrc-replica:
    profiles: [ha]
    image: ${DOCKER_IMAGE:-pingwin1900/mmrc}:${DOCKER_IMAGE_TAG:-v340}
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-12h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SILENT_CONSOLE=${SILENT_CONSOLE:-false}
      - MMRC_DATA_DIR=/app/data
      - CONTENT_ROOT=/app/data
      - STREAMS_OUTPUT_DIR=/app/data/streams
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
      - CONVERTER_IMAGE=${CONVERTER_IMAGE:-pingwin1900/mmrc-converter}
      - FFMPEG_IMAGE=${FFMPEG_IMAGE:-pingwin1900/mmrc-ffmpeg}
      - LOGS_DIR=/app/data/logs
      - WAL_CHECKPOINT_INTERVAL_MS=${WAL_CHECKPOINT_INTERVAL_MS:-300000}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-mmrc-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-mmrc}
      - DB_USER=${DB_USER:-mmrc}
      - DB_PASSWORD=${DB_PASSWORD:-mmrc}
      - MMRC_DOCKER=1
      - MMRC_COMPOSE_DIR=/host
      - DOCKER_IMAGE=${DOCKER_IMAGE:-pingwin1900/mmrc}
      - DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG:-v340}
      - REDIS_URL=${REDIS_URL:-redis://mmrc-redis:6379}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://mmrc-minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mmrc}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    expose:
      - "80"
      - "3000"
    volumes:
      - ${CONTENT_DIR:-./data}:/app/data
      - mmrc-config:/app/config
      - mmrc-temp:/app/.tmp
      - mmrc-certs:/etc/nginx/ssl-certs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      mmrc-network:
        aliases:
          - mmrc-replica

  nginx-ha:
    profiles: [ha]
    image: nginx:alpine
    container_name: mmrc-nginx-ha
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/ha-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - mmrc-certs:/etc/nginx/ssl:ro
    depends_on:
      mmrc-replica:
        condition: service_healthy
    networks:
      - mmrc-network

  minio-setup:
    image: minio/mc:latest
    profiles: [s3]
    container_name: mmrc-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://mmrc-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb local/${S3_BUCKET:-mmrc} --ignore-existing;
      mc anonymous set download local/${S3_BUCKET:-mmrc};
      exit 0;
      "
    networks:
      - mmrc-network

volumes:
  mmrc-config:
    driver: local
  mmrc-temp:
    driver: local
  mmrc-certs:
    driver: local
  mmrc-pgdata:
    driver: local
  mmrc-redis:
    driver: local

networks:
  mmrc-network:
    driver: bridge
