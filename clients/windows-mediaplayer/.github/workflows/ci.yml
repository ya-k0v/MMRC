name: Windows Player CI

on:
  push:
    branches: [v340, v350, main]
    paths:
      - 'clients/windows-mediaplayer/**'
  pull_request:
    paths:
      - 'clients/windows-mediaplayer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Player
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        working-directory: clients/windows-mediaplayer/src/MMRCPlayer
        run: dotnet restore -r win-x64

      - name: Setup VLC native binaries
        working-directory: clients/windows-mediaplayer
        shell: pwsh
        run: ./setup-vlc.ps1

      - name: Build
        working-directory: clients/windows-mediaplayer/src/MMRCPlayer
        run: dotnet publish -c Release -r win-x64 --self-contained true -o ../../publish

      - name: Verify
        working-directory: clients/windows-mediaplayer
        shell: pwsh
        run: |
          $exe = "publish\MMRCPlayer.exe"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "MMRCPlayer.exe: $size MB"
          if ($size -lt 5) {
            Write-Error "Self-contained build failed - exe too small"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMRCPlayer-${{ github.sha }}
          path: clients/windows-mediaplayer/publish/
          retention-days: 14
