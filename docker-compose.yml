version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mmrc-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: mmrc
      POSTGRES_USER: mmrc
      POSTGRES_PASSWORD: mmrc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmrc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
