x-mmrc-service: &mmrc-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INCLUDE_DOCKER_CLI: "true"
  restart: unless-stopped
  # Лимиты ресурсов. Главная цель — чтобы при обработке видео (ffmpeg, конвертация)
  # контейнер mmrc не захватил все ядра хоста: остальные контейнеры и сам хост
  # должны оставаться отзывчивыми. MMRC_CPU_LIMIT задаётся в .env
  # (обычно = число ядер хоста минус запас под остальное, минимум 1).
  deploy:
    resources:
      limits:
        cpus: "${MMRC_CPU_LIMIT:-2.0}"
        memory: 4G
        pids: 512
  # Ротация stdout-логов контейнера, иначе json-file растёт без ограничений.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  environment:
    - NODE_ENV=${NODE_ENV:-production}
    - PORT=3000
    - HOST=0.0.0.0
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env, generate with openssl rand -hex 64}
    - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-12h}
    - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - SILENT_CONSOLE=${SILENT_CONSOLE:-false}
    - MMRC_DATA_DIR=/app/data
    - CONTENT_ROOT=/app/data
    - STREAMS_OUTPUT_DIR=/app/data/streams
    - LOGS_DIR=/app/data/logs
    - WAL_CHECKPOINT_INTERVAL_MS=${WAL_CHECKPOINT_INTERVAL_MS:-300000}
    - NIGHT_OPT_START_HOUR=${NIGHT_OPT_START_HOUR:-1}
    - NIGHT_OPT_END_HOUR=${NIGHT_OPT_END_HOUR:-5}
    - JOB_RESERVE_CPU_PERCENT=${JOB_RESERVE_CPU_PERCENT:-30}
    - JOB_RESERVE_MEMORY_MB=${JOB_RESERVE_MEMORY_MB:-2048}
    - STREAM_MAX_JOBS=${STREAM_MAX_JOBS:-100}
    - STREAM_IDLE_TIMEOUT_MS=${STREAM_IDLE_TIMEOUT_MS:-180000}
    - LDAP_URL=${LDAP_URL:-}
    - LDAP_BIND_DN=${LDAP_BIND_DN:-}
    - LDAP_BASE_DN=${LDAP_BASE_DN:-}
    - DB_TYPE=${DB_TYPE:-sqlite}
    - DB_HOST=${DB_HOST:-mmrc-postgres}
    - DB_PORT=${DB_PORT:-5432}
    - DB_NAME=${DB_NAME:-mmrc}
    - DB_USER=${DB_USER:-mmrc}
    - DB_PASSWORD=${DB_PASSWORD:-mmrc}
    - MMRC_DOCKER=${MMRC_DOCKER:-1}
    - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
    - CONVERTER_IMAGE=${CONVERTER_IMAGE:-pingwin1900/mmrc-converter}
    - FFMPEG_IMAGE=${FFMPEG_IMAGE:-pingwin1900/mmrc-ffmpeg}
    - REDIS_URL=${REDIS_URL:-redis://mmrc-redis:6379}
    - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
    - S3_ENDPOINT=${S3_ENDPOINT:-http://mmrc-minio:9000}
    - S3_REGION=${S3_REGION:-us-east-1}
    - S3_BUCKET=${S3_BUCKET:-mmrc}
    - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
    - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    - MMRC_CORS_ORIGINS=${MMRC_CORS_ORIGINS:-}
    - MMRC_ANDROID_PACKAGE=${MMRC_ANDROID_PACKAGE:-com.videocontrol.mediaplayer}
    - MMRC_ANDROID_ACTIVITY=${MMRC_ANDROID_ACTIVITY:-com.videocontrol.mediaplayer.MainActivity}
    - MMRC_ADB_PORT=${MMRC_ADB_PORT:-5555}
    - MMRC_APK_UPLOAD_DIR=${MMRC_APK_UPLOAD_DIR:-/tmp/mmrc-apk-upload}
  volumes:
    - mmrc-data:/app/data
    - mmrc-config:/app/config
    - mmrc-temp:/app/.tmp
    # РИЗК: сокет отдаёт контейнеру доступ к Docker-демону на хосте, т.е.
    # компрометация приложения = root на хосте. Сокет оставлен намеренно:
    # без него перестают работать self-update из админки (docker pull/rm/compose)
    # и конвертация PPTX→PDF — MMRC_DOCKER=1, а soffice в образ не входит
    # (см. src/converters/document-converter.js:319).
    # Если эти две функции не нужны — удалите строку и уберите
    # INCLUDE_DOCKER_CLI из build.args: docker CLI станет не нужен.
    - /var/run/docker.sock:/var/run/docker.sock
    - /var/lib/mmrc/certs:/var/lib/mmrc/certs:ro
  # Запрещает повышать привилегии через setuid/setcap-бинарники внутри контейнера.
  # nginx (мастер root → воркеры www-data), tini и docker CLI этого не требуют,
  # а post-pull-sync.sh вызывается с SKIP_SERVICE_RESTART=1, поэтому sudo/systemctl
  # внутри контейнера не достигаются.
  security_opt:
    - no-new-privileges:true
  # Минимальный набор capabilities: docker CLI ходит в демон по unix-сокету,
  # adb — по TCP, nginx нужен только NET_BIND_SERVICE для 80/443.
  # Если бинарник запросит отсутствующую cap — контейнер упадёт с ошибкой запуска,
  # тогда верните нужную в cap_add.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - NET_BIND_SERVICE
    - SETGID
    - SETUID
    - SETPCAP
  healthcheck:
    test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:
  mmrc:
    <<: *mmrc-service
    container_name: mmrc
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      mmrc-network:
        aliases:
          - mmrc-server

  mmrc-replica:
    <<: *mmrc-service
    profiles: [ha]
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env, generate with openssl rand -hex 64}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-12h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SILENT_CONSOLE=${SILENT_CONSOLE:-false}
      - MMRC_DATA_DIR=/app/data
      - CONTENT_ROOT=/app/data
      - STREAMS_OUTPUT_DIR=/app/data/streams
      - LOGS_DIR=/app/data/logs
      - WAL_CHECKPOINT_INTERVAL_MS=${WAL_CHECKPOINT_INTERVAL_MS:-300000}
      - NIGHT_OPT_START_HOUR=${NIGHT_OPT_START_HOUR:-1}
      - NIGHT_OPT_END_HOUR=${NIGHT_OPT_END_HOUR:-5}
      - JOB_RESERVE_CPU_PERCENT=${JOB_RESERVE_CPU_PERCENT:-30}
      - JOB_RESERVE_MEMORY_MB=${JOB_RESERVE_MEMORY_MB:-2048}
      - STREAM_MAX_JOBS=${STREAM_MAX_JOBS:-100}
      - STREAM_IDLE_TIMEOUT_MS=${STREAM_IDLE_TIMEOUT_MS:-180000}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-mmrc-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-mmrc}
      - DB_USER=${DB_USER:-mmrc}
      - DB_PASSWORD=${DB_PASSWORD:-mmrc}
      - MMRC_DOCKER=${MMRC_DOCKER:-1}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
      - CONVERTER_IMAGE=${CONVERTER_IMAGE:-pingwin1900/mmrc-converter}
      - FFMPEG_IMAGE=${FFMPEG_IMAGE:-pingwin1900/mmrc-ffmpeg}
      - MMRC_HA_MODE=true
      - REDIS_URL=${REDIS_URL:-redis://mmrc-redis:6379}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://mmrc-minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mmrc}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - MMRC_CORS_ORIGINS=${MMRC_CORS_ORIGINS:-}
      - MMRC_ANDROID_PACKAGE=${MMRC_ANDROID_PACKAGE:-com.videocontrol.mediaplayer}
      - MMRC_ANDROID_ACTIVITY=${MMRC_ANDROID_ACTIVITY:-com.videocontrol.mediaplayer.MainActivity}
      - MMRC_ADB_PORT=${MMRC_ADB_PORT:-5555}
      - MMRC_APK_UPLOAD_DIR=${MMRC_APK_UPLOAD_DIR:-/tmp/mmrc-apk-upload}
    expose:
      - "80"
      - "3000"
    networks:
      mmrc-network:
        aliases:
          - mmrc-replica

  nginx-ha:
    profiles: [ha]
    image: nginx:alpine
    container_name: mmrc-nginx-ha
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/ha-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/mmrc/certs:/etc/nginx/ssl:ro
    depends_on:
      mmrc-replica:
        condition: service_healthy
    networks:
      - mmrc-network

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    container_name: mmrc-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - POSTGRES_DB=${DB_NAME:-mmrc}
      - POSTGRES_USER=${DB_USER:-mmrc}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mmrc}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - mmrc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mmrc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mmrc-network

  streamer:
    build:
      context: .
      dockerfile: Dockerfile.streamer
    profiles: [streamer]
    container_name: mmrc-streamer
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${MMRC_CPU_LIMIT:-2.0}"
          memory: 2G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - PORT=3001
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
    volumes:
      - mmrc-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      mmrc-network:
        aliases:
          - mmrc-streamer

  redis:
    image: redis:7-alpine
    container_name: mmrc-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      # Если REDIS_PASSWORD задан — включаем requirepass. РЕДИС URL приложения
      # (REDIS_URL) должен тогда содержать пароль: redis://:PASS@mmrc-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - if [ -n "$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes; else exec redis-server --appendonly yes; fi
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mmrc-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mmrc-network

  minio:
    image: ${MINIO_IMAGE:-pingwin1900/mmrc:minio-${DOCKER_IMAGE_TAG:-v340}}
    profiles: [s3]
    container_name: mmrc-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - mmrc-minio:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "mc alias set l http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready l >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mmrc-network

  minio-setup:
    image: ${MINIO_MC_IMAGE:-pingwin1900/mmrc:minio-${DOCKER_IMAGE_TAG:-v340}}
    profiles: [s3]
    container_name: mmrc-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://mmrc-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb local/${S3_BUCKET:-mmrc} --ignore-existing;
        mc anonymous set download local/${S3_BUCKET:-mmrc};
    networks:
      - mmrc-network

volumes:
  mmrc-data:
    driver: local
  mmrc-config:
    driver: local
  mmrc-temp:
    driver: local
  mmrc-pgdata:
    driver: local
  mmrc-redis:
    driver: local
  mmrc-minio:
    driver: local

networks:
  mmrc-network:
    driver: bridge