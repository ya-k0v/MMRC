<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Вход - MMRC Hub</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
  <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">
    <div class="card" style="max-width:400px; width:100%;">
      <div class="header">
        <div class="title" id="pageTitle">Вход в MMRC Hub</div>
      </div>
      
      <div id="setupForm" style="display:none;">
        <div class="meta" style="margin-bottom:16px; color:var(--muted);">
          Первичная настройка: создайте учётную запись администратора
        </div>
        <form id="setupFormEl" style="display:flex; flex-direction:column; gap:16px;">
          <div>
            <label style="display:block; margin-bottom:4px; font-weight:500;">Логин</label>
            <input 
              type="text" 
              id="setupUsername" 
              class="input" 
              placeholder="admin" 
              autocomplete="username"
              required 
              autofocus
              minlength="3"
              maxlength="50"
            />
          </div>
          
          <div>
            <label style="display:block; margin-bottom:4px; font-weight:500;">ФИО</label>
            <input 
              type="text" 
              id="setupFullName" 
              class="input" 
              placeholder="Администратор" 
              autocomplete="name"
              required
              minlength="1"
              maxlength="100"
            />
          </div>
          
          <div>
            <label style="display:block; margin-bottom:4px; font-weight:500;">Пароль (мин. 12 символов)</label>
            <input 
              type="password" 
              id="setupPassword" 
              class="input" 
              placeholder="Введите пароль" 
              autocomplete="new-password"
              required
              minlength="12"
            />
          </div>
          
          <div>
            <label style="display:block; margin-bottom:4px; font-weight:500;">Подтвердите пароль</label>
            <input 
              type="password" 
              id="setupPasswordConfirm" 
              class="input" 
              placeholder="Повторите пароль" 
              autocomplete="new-password"
              required
            />
          </div>
          
          <div id="setupError" style="color:var(--danger); font-size:0.875rem; display:none;"></div>
          
          <button type="submit" class="primary" id="setupBtn" style="width:100%;">
            Создать администратора
          </button>
        </form>
      </div>

      <form id="loginForm" style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">Логин</label>
          <input 
            type="text" 
            id="username" 
            class="input" 
            placeholder="admin" 
            autocomplete="username"
            required 
            autofocus
          />
        </div>
        
        <div>
          <label style="display:block; margin-bottom:4px; font-weight:500;">Пароль</label>
          <input 
            type="password" 
            id="password" 
            class="input" 
            placeholder="Введите пароль" 
            autocomplete="current-password"
            required
          />
        </div>
        
        <div id="error" style="color:var(--danger); font-size:0.875rem; display:none;"></div>
        
        <button type="submit" class="primary" id="loginBtn" style="width:100%;">
          Войти
        </button>
      </form>
      
      <div class="meta" style="margin-top:16px; text-align:center;">
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const setupForm = document.getElementById('setupForm');
    const setupFormEl = document.getElementById('setupFormEl');
    const errorEl = document.getElementById('error');
    const setupErrorEl = document.getElementById('setupError');
    const loginBtn = document.getElementById('loginBtn');
    const setupBtn = document.getElementById('setupBtn');
    const pageTitle = document.getElementById('pageTitle');

    function setLoginButtonLoading(isLoading) {
      loginBtn.disabled = isLoading;
      loginBtn.textContent = isLoading ? 'Вход...' : 'Войти';
    }

    function setSetupButtonLoading(isLoading) {
      setupBtn.disabled = isLoading;
      setupBtn.textContent = isLoading ? 'Создание...' : 'Создать администратора';
    }
    
    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function showSetupError(message) {
      setupErrorEl.textContent = message;
      setupErrorEl.style.display = 'block';
    }

    async function checkSetupStatus() {
      try {
        const response = await fetch('/api/auth/setup/status');
        if (response.ok) {
          const data = await response.json();
          return data.needsSetup;
        }
      } catch (err) {
        console.error('Setup status check failed:', err);
      }
      return false;
    }

    async function initPage() {
      const needsSetup = await checkSetupStatus();
      
      if (needsSetup) {
        pageTitle.textContent = 'Первичная настройка MMRC Hub';
        loginForm.style.display = 'none';
        setupForm.style.display = 'block';
      } else {
        pageTitle.textContent = 'Вход в MMRC Hub';
        setupForm.style.display = 'none';
        loginForm.style.display = 'flex';
      }
      
      // Check for existing valid token
      const token = localStorage.getItem('accessToken');
      const userStr = localStorage.getItem('user');
      
      if (token && userStr && !needsSetup) {
        try {
          const user = JSON.parse(userStr);
          const response = await fetch('/api/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          
          if (response.ok) {
            if (user.role === 'speaker' || user.role === 'manager') {
              window.location.replace('/speaker.html');
            } else if (user.role === 'hero_admin') {
              window.location.replace('/hero/admin.html');
            } else {
              window.location.replace('/admin.html');
            }
            return;
          }
        } catch (e) {
          console.error('[Index] Error checking auth:', e);
        }
        localStorage.clear();
      }
    }

    setupFormEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('setupUsername').value.trim();
      const fullName = document.getElementById('setupFullName').value.trim();
      const password = document.getElementById('setupPassword').value;
      const passwordConfirm = document.getElementById('setupPasswordConfirm').value;
      
      if (!username || !fullName || !password || !passwordConfirm) {
        showSetupError('Заполните все поля');
        return;
      }
      
      if (password !== passwordConfirm) {
        showSetupError('Пароли не совпадают');
        return;
      }
      
      if (password.length < 12) {
        showSetupError('Пароль должен быть не менее 12 символов');
        return;
      }
      
      setSetupButtonLoading(true);
      setupErrorEl.style.display = 'none';
      
      try {
        const response = await fetch('/api/auth/setup-first-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, full_name: fullName, password })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }
        
        if (response.ok) {
          localStorage.setItem('accessToken', data.accessToken);
          localStorage.setItem('refreshToken', data.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.replace('/admin.html');
        } else {
          showSetupError(data.error || 'Ошибка создания администратора');
        }
      } catch (err) {
        console.error('Setup error:', err);
        showSetupError('Ошибка подключения к серверу');
      } finally {
        setSetupButtonLoading(false);
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('Заполните все поля');
        return;
      }
      
      setLoginButtonLoading(true);
      errorEl.style.display = 'none';
      let redirected = false;
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }
        
        if (response.ok) {
          localStorage.setItem('accessToken', data.accessToken);
          localStorage.setItem('refreshToken', data.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          if (data.user.role === 'hero_admin') {
            redirected = true;
            window.location.href = '/hero/admin.html';
          } else if (data.user.role === 'admin') {
            redirected = true;
            window.location.href = '/admin.html';
          } else if (data.user.role === 'speaker' || data.user.role === 'manager') {
            redirected = true;
            window.location.href = '/speaker.html';
          } else {
            redirected = true;
            window.location.href = '/admin.html';
          }
        } else {
          const blockedByCode = data.code === 'ACCOUNT_DISABLED';
          const blockedByStatus = response.status === 403 && /отключ|заблок|disabled|blocked/i.test(String(data.error || ''));

          if (blockedByCode || blockedByStatus) {
            showError('Пользователь заблокирован. Обратитесь к администратору.');
          } else {
            showError(data.error || 'Неверный логин или пароль');
          }
        }
      } catch (err) {
        console.error('Login error:', err);
        showError('Ошибка подключения к серверу');
      } finally {
        if (!redirected) {
          setLoginButtonLoading(false);
        }
      }
    });

    initPage();
  </script>
</body>
</html>
