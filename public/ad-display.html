<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ad Display</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { width: 100%; height: 100%; }
    .video-js { width: 100% !important; height: 100% !important; }
    .video-js .vjs-tech { object-fit: contain; }
    #imageDisplay { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: #000; }
    #imageDisplay img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font: 24px sans-serif; z-index: 100; }
    #overlay.hidden { display: none; }
    #playerBadge {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9999;
      color: rgba(200, 200, 200, 0.65);
      font-size: 12px;
      line-height: 1.3;
      text-align: right;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
      max-width: min(60vw, 480px);
    }
    @media (max-width: 767px) {
      #playerBadge {
        bottom: 8px;
        right: 8px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="overlay">Подключение к серверу...</div>
  <div id="playerBadge" aria-hidden="true"></div>
  <div id="imageDisplay"><img id="imageEl" /></div>
  <video id="player" class="video-js vjs-default-skin" autoplay muted playsinline></video>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script>
    const socket = io();
    const playerEl = document.getElementById('player');
    const imageDisplay = document.getElementById('imageDisplay');
    const imageEl = document.getElementById('imageEl');
    const overlay = document.getElementById('overlay');
    const params = new URLSearchParams(location.search);
    const deviceId = params.get('device_id') || localStorage.getItem('ad_device_id');
    const isPreview = params.get('preview') === '1';

    let player = null;
    let fileList = [];
    let fileWeights = {};
    let currentIndex = 0;
    let imageTimer = null;
    let progressTimer = null;
    let registered = false;

    function initPlayer() {
      if (!player) {
        player = videojs(playerEl, {
          controls: false, autoplay: true, muted: true, preload: 'auto',
          html5: { nativeAudioTracks: false, nativeVideoTracks: false }
        });
        player.on('ended', () => {
          if (currentFileName) markCompleted(currentFileName);
          currentFileName = null;
          playNext();
        });
        player.on('error', () => {
          if (currentFileName) logDeviceEvent('playback_error', currentFileName);
          currentFileName = null;
          setTimeout(playNext, 5000);
        });
      }
    }

    function getContentUrl(fileName) {
      return `/api/files/resolve/${encodeURIComponent(deviceId)}/${encodeURIComponent(fileName)}`;
    }

    const IMAGE_EXTS = new Set(['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg']);

    function isImageFile(name) {
      const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
      return IMAGE_EXTS.has(ext);
    }

    function fileNameOnly(p) { return p.split(/[/\\]/).pop(); }

    function sendProgress(fileName, currentTime, duration) {
      if (!registered || isPreview) return;
      socket.emit('player/progress', {
        device_id: deviceId,
        type: 'video',
        file: fileName,
        currentTime: currentTime || 0,
        duration: duration || 0
      });
    }

    function logDeviceEvent(event, detail) {
      if (isPreview) return;
      fetch('/api/ad/analytics/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId, event, detail: detail || null })
      }).catch(() => {});
    }

    function markCompleted(fileName) {
      if (isPreview) return;
      fetch('/api/ad/analytics/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId, file_name: fileName })
      }).catch(() => {});
    }

    const IMAGE_DURATION = 10;

    function showImage(fileName) {
      const url = getContentUrl(fileName);
      imageDisplay.style.display = 'flex';
      playerEl.style.display = 'none';
      overlay.classList.add('hidden');
      currentFileName = fileName;
      imageEl.src = url;
      reportImpression(fileName, IMAGE_DURATION, 1);
      sendProgress(fileName, 0, IMAGE_DURATION);
      clearTimeout(imageTimer);
      imageTimer = setTimeout(() => {
        markCompleted(fileName);
        currentFileName = null;
        playNext();
      }, IMAGE_DURATION * 1000);
    }

    let currentFileName = null;

    function playVideoFile(fileName) {
      const url = getContentUrl(fileName);
      imageDisplay.style.display = 'none';
      playerEl.style.display = '';
      overlay.classList.add('hidden');
      currentFileName = fileName;
      try {
        const ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
        const mime = ext === '.webm' ? 'video/webm' : ext === '.ogg' ? 'video/ogg' : 'video/mp4';
        player.src({ src: url, type: mime });
        player.play();
        player.one('loadedmetadata', () => {
          const dur = Math.round(player.duration() || 0);
          reportImpression(fileName, dur, 0);
        });
        progressTimer = setInterval(() => {
          if (player && !player.paused()) {
            sendProgress(fileName, player.currentTime(), player.duration());
          }
        }, 2000);
      } catch {
        logDeviceEvent('playback_error', fileName);
        setTimeout(playNext, 3000);
      }
    }

    function pickWeightedFile() {
      if (!fileList.length) return null;
      const candidates = [];
      for (const f of fileList) {
        const w = fileWeights[f] || 1;
        for (let i = 0; i < w; i++) candidates.push(f);
      }
      return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : fileList[0];
    }

    async function playNext() {
      clearInterval(progressTimer);
      if (!fileList.length) {
        overlay.textContent = 'Нет файлов. Ожидание...';
        overlay.classList.remove('hidden');
        setTimeout(() => { socket.emit('files/request', { device_id: deviceId }); playNext(); }, 30000);
        return;
      }
      const fileName = pickWeightedFile();
      if (isImageFile(fileName)) showImage(fileName);
      else playVideoFile(fileName);
    }

    async function reportImpression(fileName, durationSec, completed) {
      if (isPreview) return;
      try {
        await fetch('/api/ad/analytics/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            device_id: deviceId,
            file_name: fileName,
            duration_sec: durationSec || null,
            completed: completed ? 1 : 0
          })
        });
      } catch {}
    }

    function filterPlayableFiles(files) {
      return (files || []).filter(f => {
        const ext = f.substring(f.lastIndexOf('.')).toLowerCase();
        return isImageFile(f) || ['.mp4', '.webm', '.ogg', '.mkv', '.mov', '.avi'].includes(ext);
      });
    }

    async function start() {
      if (!deviceId) {
        overlay.textContent = '?device_id=ID в URL';
        overlay.classList.remove('hidden');
        return;
      }
      localStorage.setItem('ad_device_id', deviceId);
      initPlayer();

      const badge = document.getElementById('playerBadge');
      if (badge) badge.textContent = isPreview ? 'Превью: ' + deviceId : deviceId;
      if (isPreview) {
        overlay.textContent = 'Загрузка превью...';
      }

      socket.on('connect', () => {
        if (isPreview) {
          overlay.textContent = 'Загрузка файлов...';
          socket.emit('files/request', { device_id: deviceId });
        } else {
          overlay.textContent = 'Регистрация...';
          logDeviceEvent('online', 'socket_connected');
          socket.emit('player/register', { device_id: deviceId, device_type: 'ad_monitor', platform: 'ad_display' });
        }
      });

      socket.on('disconnect', () => {
        if (!isPreview) logDeviceEvent('offline', 'socket_disconnected');
      });

      socket.on('player/reject', (data) => {
        if (!isPreview) logDeviceEvent('reject', data.reason || 'unknown_device');
        overlay.textContent = 'Устройство не найдено: ' + (data.reason || 'unknown_device');
        overlay.classList.remove('hidden');
      });

      function onFilesReady(files) {
        fileList = filterPlayableFiles(files || []);
        registered = true;
        overlay.classList.add('hidden');
        playNext();
      }

      socket.on('player/registered', async (data) => {
        if (isPreview) return;
        onFilesReady(data.files);
        try {
          const r = await fetch(`/api/ad/weights/${encodeURIComponent(deviceId)}`);
          const wd = await r.json();
          if (wd.weights) fileWeights = wd.weights;
        } catch {}
      });

      socket.on('files/list', (data) => {
        if (data.device_id !== deviceId) return;
        if (isPreview && !registered) {
          onFilesReady(data.files);
          return;
        }
        const newFiles = filterPlayableFiles(data.files || []);
        if (JSON.stringify(newFiles) !== JSON.stringify(fileList)) {
          fileList = newFiles;
          currentIndex = 0;
          if (player) { try { player.pause(); } catch {} }
          clearTimeout(imageTimer);
          playNext();
        }
      });

      socket.on('devices/updated', () => {
        socket.emit('files/request', { device_id: deviceId });
      });
    }

    document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
