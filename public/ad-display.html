<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ad Display</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { width: 100%; height: 100%; }
    .video-js { width: 100% !important; height: 100% !important; }
    .video-js .vjs-tech { object-fit: contain; }
    #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font: 24px sans-serif; z-index: 100; }
    #overlay.hidden { display: none; }
    #info { position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.3); font: 12px monospace; z-index: 50; }
  </style>
</head>
<body>
  <div id="overlay">Подключение к серверу...</div>
  <div id="info"></div>
  <video id="player" class="video-js vjs-default-skin" autoplay muted playsinline></video>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script>
    const socket = io();
    const playerEl = document.getElementById('player');
    const overlay = document.getElementById('overlay');
    const info = document.getElementById('info');
    const params = new URLSearchParams(location.search);
    const displayId = params.get('display_id') || localStorage.getItem('ad_display_id');

    let player = null;
    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    let isPlaying = false;

    function initPlayer() {
      if (!player) {
        player = videojs(playerEl, {
          controls: false,
          autoplay: true,
          muted: true,
          preload: 'auto',
          html5: { nativeAudioTracks: false, nativeVideoTracks: false }
        });
        player.on('ended', playNext);
        player.on('error', () => { setTimeout(playNext, 5000); });
      }
    }

    async function fetchPlaylist() {
      try {
        const res = await fetch(`/api/ad/displays/${displayId}/playlist`);
        const data = await res.json();
        return data.playlist || [];
      } catch { return []; }
    }

    function selectWeighted(entries) {
      const totalWeight = entries.reduce((s, e) => s + (e.weight || 1), 0);
      let rand = Math.random() * totalWeight;
      for (const e of entries) {
        rand -= (e.weight || 1);
        if (rand <= 0) return e;
      }
      return entries[0];
    }

    async function playNext() {
      if (!playlist.length) {
        overlay.textContent = 'Плейлист пуст. Ожидание...';
        overlay.classList.remove('hidden');
        setTimeout(async () => {
          playlist = await fetchPlaylist();
          playNext();
        }, 30000);
        return;
      }

      const defaultVideo = playlist.find(v => v.is_default);
      const regularVideos = playlist.filter(v => !v.is_default);

      let next;
      if (!currentIndex && defaultVideo) {
        next = defaultVideo;
      } else if (regularVideos.length) {
        next = selectWeighted(regularVideos);
      } else {
        next = defaultVideo || playlist[0];
      }

      currentIndex++;
      if (currentIndex > 100) currentIndex = 0;

      const videoUrl = `/ad-content/${path.basename(next.file_path)}`;
      overlay.classList.add('hidden');
      info.textContent = `${next.name} (${next.duration || 0}s)`;

      try {
        player.src({ src: videoUrl, type: 'video/mp4' });
        player.play();
        reportImpression(next);
      } catch (e) {
        setTimeout(playNext, 3000);
      }
    }

    async function reportImpression(video) {
      try {
        await fetch(`/api/ad/analytics/${displayId}/report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_id: video.id, is_default: video.is_default })
        });
      } catch {}
    }

    function pathBasename(p) {
      return p.split(/[/\\]/).pop();
    }
    const path = { basename: pathBasename };

    async function start() {
      if (!displayId) {
        overlay.textContent = 'Укажите display_id в URL (?display_id=1)';
        overlay.classList.remove('hidden');
        return;
      }
      localStorage.setItem('ad_display_id', displayId);
      initPlayer();
      playlist = await fetchPlaylist();
      playNext();

      setInterval(async () => {
        playlist = await fetchPlaylist();
      }, 60000);
    }

    document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
