<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ad Display</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #viewport { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    #player { width: 100%; height: 100%; }
    .video-js { width: 100% !important; height: 100% !important; }
    .video-js .vjs-tech { object-fit: contain; }
    #imageDisplay { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: #000; }
    #imageDisplay img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font: 24px sans-serif; z-index: 100; }
    #overlay.hidden { display: none; }
    #offlineBadge {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: rgba(220, 38, 38, 0.85);
      color: #fff;
      font: 11px sans-serif;
      padding: 3px 8px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="viewport">
    <div id="imageDisplay"><img id="imageEl" /></div>
    <video id="player" class="video-js vjs-default-skin" autoplay muted playsinline></video>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw-ad-display.js').catch(() => {});
    }

    const socket = io({ reconnection: true, reconnectionDelay: 2000, reconnectionAttempts: Infinity });
    const playerEl = document.getElementById('player');
    const imageDisplay = document.getElementById('imageDisplay');
    const imageEl = document.getElementById('imageEl');
    const overlay = document.getElementById('overlay');
    const offlineBadge = document.getElementById('offlineBadge');
    const params = new URLSearchParams(location.search);
    const deviceId = params.get('device_id') || localStorage.getItem('ad_device_id');
    const isPreview = params.get('preview') === '1';
    const displayW = parseInt(params.get('w')) || 0;
    const displayH = parseInt(params.get('h')) || 0;

    let player = null;
    let fileList = [];
    let fileWeights = {};
    let currentIndex = 0;
    let imageTimer = null;
    let progressTimer = null;
    let registered = false;
    let pingTimer = null;
    let preloadTimer = null;
    let offline = false;
    let statsQueue = [];

    const LS_FILE_LIST = 'ad_file_list';
    const LS_FILE_WEIGHTS = 'ad_file_weights';
    const LS_STATS_QUEUE = 'ad_stats_queue';
    const LS_DISPLAY_W = 'ad_display_w';
    const LS_DISPLAY_H = 'ad_display_h';

    function saveFileList(files) {
      try { localStorage.setItem(LS_FILE_LIST, JSON.stringify(files)); } catch {}
    }
    function loadCachedFileList() {
      try {
        const v = localStorage.getItem(LS_FILE_LIST);
        if (v) return JSON.parse(v);
      } catch {}
      return null;
    }
    function saveWeights(w) {
      try { localStorage.setItem(LS_FILE_WEIGHTS, JSON.stringify(w)); } catch {}
    }
    function loadCachedWeights() {
      try {
        const v = localStorage.getItem(LS_FILE_WEIGHTS);
        if (v) return JSON.parse(v);
      } catch {}
      return null;
    }
    function persistStatsQueue() {
      try { localStorage.setItem(LS_STATS_QUEUE, JSON.stringify(statsQueue)); } catch {}
    }
    function loadPersistedStatsQueue() {
      try {
        const v = localStorage.getItem(LS_STATS_QUEUE);
        if (v) { statsQueue = JSON.parse(v); }
      } catch {}
    }

    async function isFileCached(url) {
      if (!('caches' in window)) return false;
      try {
        const cache = await caches.open('ad-display-v1');
        const match = await cache.match(url);
        return !!match;
      } catch { return false; }
    }

    async function findAvailableFile() {
      if (!fileList.length) return null;
      if (!offline) return pickWeightedFile();
      for (let attempt = 0; attempt < fileList.length * 2; attempt++) {
        const f = pickWeightedFile();
        if (await isFileCached(getContentUrl(f))) return f;
      }
      return null;
    }

    let viewW = displayW;
    let viewH = displayH;
    if (!viewW || !viewH) {
      viewW = parseInt(localStorage.getItem(LS_DISPLAY_W)) || 0;
      viewH = parseInt(localStorage.getItem(LS_DISPLAY_H)) || 0;
    } else {
      try { localStorage.setItem(LS_DISPLAY_W, String(viewW)); localStorage.setItem(LS_DISPLAY_H, String(viewH)); } catch {}
    }
    if (viewW > 0 && viewH > 0) {
      const vp = document.getElementById('viewport');
      if (vp) vp.style.aspectRatio = `${viewW} / ${viewH}`;
    }

    if (isPreview) {
      document.getElementById('offlineBadge')?.remove();
    } else {
      loadPersistedStatsQueue();
    }

    function initPlayer() {
      if (!player) {
        player = videojs(playerEl, {
          controls: false, autoplay: true, muted: true, preload: 'auto',
          html5: { nativeAudioTracks: false, nativeVideoTracks: false }
        });
        player.on('ended', () => {
          if (currentFileName) markCompleted(currentFileName);
          currentFileName = null;
          playNext();
        });
        player.on('error', () => {
          if (currentFileName) sendStats('/api/ad/analytics/log', { device_id: deviceId, event: 'playback_error', detail: currentFileName });
          currentFileName = null;
          setTimeout(playNext, 5000);
        });
      }
    }

    function getContentUrl(fileName) {
      return `/api/files/resolve/${encodeURIComponent(deviceId)}/${encodeURIComponent(fileName)}`;
    }

    const IMAGE_EXTS = new Set(['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg']);

    function isImageFile(name) {
      const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
      return IMAGE_EXTS.has(ext);
    }

    function fileNameOnly(p) { return p.split(/[/\\]/).pop(); }

    function sendProgress(fileName, currentTime, duration) {
      if (!registered || isPreview) return;
      socket.emit('player/progress', {
        device_id: deviceId,
        type: 'video',
        file: fileName,
        currentTime: currentTime || 0,
        duration: duration || 0
      });
    }

    function sendStats(url, body) {
      if (isPreview) return Promise.resolve();
      if (offline) {
        statsQueue.push({ url, body });
        persistStatsQueue();
        return Promise.resolve();
      }
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).catch(() => {
        statsQueue.push({ url, body });
        persistStatsQueue();
      });
    }

    async function flushStatsQueue() {
      if (!statsQueue.length || offline) return;
      const items = statsQueue.splice(0);
      persistStatsQueue();
      for (const item of items) {
        try {
          await fetch(item.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(item.body)
          });
        } catch {
          statsQueue.push(item);
          persistStatsQueue();
          break;
        }
      }
      if (!statsQueue.length) {
        try { localStorage.removeItem(LS_STATS_QUEUE); } catch {}
      }
    }

    const IMAGE_DURATION = 10;

    function preloadNext() {
      clearTimeout(preloadTimer);
      preloadTimer = setTimeout(() => {
        if (!fileList.length) return;
        const next = pickNextFile();
        if (!next) return;
        const url = getContentUrl(next);
        if (isImageFile(next)) {
          const img = new Image();
          img.src = url;
        } else {
          fetch(url).catch(() => {});
        }
      }, 3000);
    }

    function pickNextFile() {
      if (!fileList.length) return null;
      const candidates = [];
      for (const f of fileList) {
        const w = fileWeights[f] || 1;
        for (let i = 0; i < w; i++) candidates.push(f);
      }
      return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : fileList[0];
    }

    function showImage(fileName) {
      const url = getContentUrl(fileName);
      imageDisplay.style.display = 'flex';
      playerEl.style.display = 'none';
      overlay.classList.add('hidden');
      currentFileName = fileName;
      imageEl.onerror = () => {
        currentFileName = null;
        sendStats('/api/ad/analytics/log', { device_id: deviceId, event: 'playback_error', detail: fileName });
        playNext();
      };
      imageEl.src = url;
      sendStats('/api/ad/analytics/report', { device_id: deviceId, file_name: fileName, duration_sec: IMAGE_DURATION, completed: 1 });
      sendProgress(fileName, 0, IMAGE_DURATION);
      clearTimeout(imageTimer);
      preloadNext();
      imageTimer = setTimeout(() => {
        markCompleted(fileName);
        currentFileName = null;
        playNext();
      }, IMAGE_DURATION * 1000);
    }

    let currentFileName = null;

    function playVideoFile(fileName) {
      const url = getContentUrl(fileName);
      imageDisplay.style.display = 'none';
      playerEl.style.display = '';
      overlay.classList.add('hidden');
      clearTimeout(imageTimer);
      currentFileName = fileName;
      try {
        const ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
        const mime = ext === '.webm' ? 'video/webm' : ext === '.ogg' ? 'video/ogg' : 'video/mp4';
        player.src({ src: url, type: mime });
        player.play();
        let loadTimeout = setTimeout(() => {
          sendStats('/api/ad/analytics/log', { device_id: deviceId, event: 'playback_error', detail: fileName + ' (timeout)' });
          currentFileName = null;
          playNext();
        }, 15000);
        player.one('loadedmetadata', () => {
          clearTimeout(loadTimeout);
          const dur = Math.round(player.duration() || 0);
          sendStats('/api/ad/analytics/report', { device_id: deviceId, file_name: fileName, duration_sec: dur, completed: 0 });
        });
        progressTimer = setInterval(() => {
          if (player && !player.paused()) {
            sendProgress(fileName, player.currentTime(), player.duration());
          }
        }, 2000);
        preloadNext();
      } catch {
        sendStats('/api/ad/analytics/log', { device_id: deviceId, event: 'playback_error', detail: fileName });
        setTimeout(playNext, 3000);
      }
    }

    function pickWeightedFile() {
      if (!fileList.length) return null;
      const candidates = [];
      for (const f of fileList) {
        const w = fileWeights[f] || 1;
        for (let i = 0; i < w; i++) candidates.push(f);
      }
      return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : fileList[0];
    }

    async function playNext() {
      clearInterval(progressTimer);
      clearTimeout(imageTimer);
      if (!fileList.length) {
        if (offline) {
          setTimeout(playNext, 10000);
          return;
        }
        if (isPreview) {
          overlay.textContent = 'Нет файлов. Ожидание...';
          overlay.classList.remove('hidden');
        }
        setTimeout(() => { socket.emit('files/request', { device_id: deviceId }); playNext(); }, 30000);
        return;
      }
      const fileName = await findAvailableFile();
      if (!fileName) {
        if (offline) {
          setTimeout(playNext, 30000);
          return;
        }
        const f = pickWeightedFile();
        if (isImageFile(f)) showImage(f);
        else playVideoFile(f);
        return;
      }
      if (isImageFile(fileName)) showImage(fileName);
      else playVideoFile(fileName);
    }

    function markCompleted(fileName) {
      if (isPreview) return;
      sendStats('/api/ad/analytics/complete', { device_id: deviceId, file_name: fileName });
    }

    function filterPlayableFiles(files) {
      return (files || []).filter(f => {
        const ext = f.substring(f.lastIndexOf('.')).toLowerCase();
        return isImageFile(f) || ['.mp4', '.webm', '.ogg', '.mkv', '.mov', '.avi'].includes(ext);
      });
    }

    function startPing() {
      clearInterval(pingTimer);
      pingTimer = setInterval(() => {
        socket.emit('player/ping', { device_id: deviceId });
      }, 30000);
    }

    async function start() {
      if (!deviceId) {
        if (isPreview) {
          overlay.textContent = '?device_id=ID в URL';
          overlay.classList.remove('hidden');
        }
        return;
      }
      localStorage.setItem('ad_device_id', deviceId);
      initPlayer();

      if (!isPreview) {
        overlay.classList.add('hidden');
        startPing();
        const cached = loadCachedFileList();
        if (cached && cached.length) {
          fileList = cached;
          const w = loadCachedWeights();
          if (w) fileWeights = w;
          playNext();
        }
      } else {
        overlay.textContent = 'Загрузка превью...';
      }

      socket.on('connect', () => {
        offline = false;
        if (offlineBadge) offlineBadge.style.display = 'none';
        flushStatsQueue();
        if (isPreview) {
          overlay.textContent = 'Загрузка файлов...';
          socket.emit('files/request', { device_id: deviceId });
        } else {
          sendStats('/api/ad/analytics/log', { device_id: deviceId, event: 'online', detail: 'socket_connected' });
          socket.emit('player/register', { device_id: deviceId, device_type: 'ad_monitor', platform: 'ad_display' });
        }
      });

      socket.on('disconnect', () => {
        offline = true;
        if (offlineBadge) offlineBadge.style.display = 'block';
        if (!isPreview) {
          statsQueue.push({ url: '/api/ad/analytics/log', body: { device_id: deviceId, event: 'offline', detail: 'socket_disconnected' } });
          persistStatsQueue();
        }
      });

      socket.on('connect_error', () => {
        offline = true;
        if (offlineBadge) offlineBadge.style.display = 'block';
        if (!fileList.length) {
          const cached = loadCachedFileList();
          if (cached && cached.length) {
            fileList = cached;
            const w = loadCachedWeights();
            if (w) fileWeights = w;
          }
        }
        if (fileList.length) {
          overlay.classList.add('hidden');
          if (!currentFileName) playNext();
        }
      });

      socket.on('player/progress', (data) => {
        if (!isPreview || data.device_id !== deviceId) return;
        if (data.file && data.file !== currentFileName) {
          currentFileName = data.file;
          if (isImageFile(data.file)) {
            showImage(data.file);
          } else {
            playVideoFile(data.file);
          }
        }
        if (player && data.type === 'video' && data.currentTime != null) {
          const diff = Math.abs(player.currentTime() - data.currentTime);
          if (diff > 2) player.currentTime(data.currentTime);
        }
      });

      socket.on('player/reject', (data) => {
        sendStats('/api/ad/analytics/log', { device_id: deviceId, event: 'reject', detail: data.reason || 'unknown_device' });
        if (isPreview) {
          overlay.textContent = 'Устройство не найдено: ' + (data.reason || 'unknown_device');
          overlay.classList.remove('hidden');
        }
      });

      function onFilesReady(files) {
        fileList = filterPlayableFiles(files || []);
        saveFileList(fileList);
        registered = true;
        overlay.classList.add('hidden');
        playNext();
      }

      socket.on('player/registered', async (data) => {
        if (isPreview) return;
        onFilesReady(data.files);
        if (data.resolutionWidth && data.resolutionHeight) {
          viewW = data.resolutionWidth; viewH = data.resolutionHeight;
          try { localStorage.setItem(LS_DISPLAY_W, String(viewW)); localStorage.setItem(LS_DISPLAY_H, String(viewH)); } catch {}
          const vp = document.getElementById('viewport');
          if (vp) vp.style.aspectRatio = `${viewW} / ${viewH}`;
        }
        try {
          const r = await fetch(`/api/ad/weights/${encodeURIComponent(deviceId)}`);
          const wd = await r.json();
          if (wd.weights) { fileWeights = wd.weights; saveWeights(fileWeights); }
        } catch {}
      });

      socket.on('files/list', (data) => {
        if (data.device_id !== deviceId) return;
        if (isPreview && !registered) {
          onFilesReady(data.files);
          return;
        }
        const newFiles = filterPlayableFiles(data.files || []);
        if (JSON.stringify(newFiles) !== JSON.stringify(fileList)) {
          fileList = newFiles;
          saveFileList(fileList);
          currentIndex = 0;
          if (player) { try { player.pause(); } catch {} }
          clearTimeout(imageTimer);
          playNext();
        }
      });

      socket.on('devices/updated', () => {
        socket.emit('files/request', { device_id: deviceId });
      });
    }

    document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
