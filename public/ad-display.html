<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ad Display</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { width: 100%; height: 100%; }
    .video-js { width: 100% !important; height: 100% !important; }
    .video-js .vjs-tech { object-fit: contain; }
    #imageDisplay { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; background: #000; }
    #imageDisplay img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font: 24px sans-serif; z-index: 100; }
    #overlay.hidden { display: none; }
    #info { position: fixed; bottom: 20px; right: 20px; color: rgba(255,255,255,0.3); font: 12px monospace; z-index: 50; }
  </style>
</head>
<body>
  <div id="overlay">Подключение к серверу...</div>
  <div id="info"></div>
  <div id="imageDisplay"><img id="imageEl" /></div>
  <video id="player" class="video-js vjs-default-skin" autoplay muted playsinline></video>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script>
    const socket = io();
    const playerEl = document.getElementById('player');
    const imageDisplay = document.getElementById('imageDisplay');
    const imageEl = document.getElementById('imageEl');
    const overlay = document.getElementById('overlay');
    const info = document.getElementById('info');
    const params = new URLSearchParams(location.search);
    const displayId = params.get('display_id') || localStorage.getItem('ad_display_id');

    let player = null;
    let playlist = [];
    let currentIndex = 0;
    let imageTimer = null;

    function initPlayer() {
      if (!player) {
        player = videojs(playerEl, {
          controls: false, autoplay: true, muted: true, preload: 'auto',
          html5: { nativeAudioTracks: false, nativeVideoTracks: false }
        });
        player.on('ended', playNext);
        player.on('error', () => { setTimeout(playNext, 5000); });
      }
    }

    async function fetchPlaylist() {
      try {
        const res = await fetch(`/api/ad/displays/${displayId}/playlist`);
        return (await res.json()).playlist || [];
      } catch { return []; }
    }

    function selectWeighted(entries) {
      const total = entries.reduce((s, e) => s + (e.weight || 1), 0);
      let r = Math.random() * total;
      for (const e of entries) { r -= (e.weight || 1); if (r <= 0) return e; }
      return entries[0];
    }

    function fileName(p) { return p.split(/[/\\]/).pop(); }

    function showImage(item) {
      const url = `/ad-content/${fileName(item.file_path)}`;
      imageEl.src = url;
      imageDisplay.style.display = 'flex';
      playerEl.style.display = 'none';
      info.textContent = `${item.name} (🖼 ${item.display_duration || 10}с)`;
      overlay.classList.add('hidden');
      reportImpression(item);
      clearTimeout(imageTimer);
      imageTimer = setTimeout(playNext, (item.display_duration || 10) * 1000);
    }

    function playVideo(item) {
      const url = `/ad-content/${fileName(item.file_path)}`;
      imageDisplay.style.display = 'none';
      playerEl.style.display = '';
      info.textContent = `${item.name} (${Math.round(item.duration || 0)}с)`;
      overlay.classList.add('hidden');
      reportImpression(item);
      try {
        player.src({ src: url, type: 'video/mp4' });
        player.play();
      } catch { setTimeout(playNext, 3000); }
    }

    async function playNext() {
      if (!playlist.length) {
        overlay.textContent = 'Плейлист пуст. Ожидание...';
        overlay.classList.remove('hidden');
        setTimeout(async () => { playlist = await fetchPlaylist(); playNext(); }, 30000);
        return;
      }
      const def = playlist.find(v => v.is_default);
      const reg = playlist.filter(v => !v.is_default);
      let next;
      if (!currentIndex && def) {
        next = def;
      } else if (reg.length) {
        next = selectWeighted(reg);
      } else {
        next = def || playlist[0];
      }
      currentIndex++;

      if (next.type === 'image') showImage(next);
      else playVideo(next);
    }

    async function reportImpression(video) {
      try {
        await fetch(`/api/ad/analytics/${displayId}/report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ video_id: video.id, is_default: video.is_default })
        });
      } catch {}
    }

    async function start() {
      if (!displayId) {
        overlay.textContent = '?display_id=ID в URL';
        overlay.classList.remove('hidden');
        return;
      }
      localStorage.setItem('ad_display_id', displayId);
      initPlayer();
      playlist = await fetchPlaylist();
      playNext();
      setInterval(async () => { playlist = await fetchPlaylist(); }, 60000);
    }

    document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
