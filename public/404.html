<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
  <title>MMRC страница не найдена</title>
  <link rel="stylesheet" href="/css/status.css"/>
</head>
<body class="status-404">
  <div class="status-wrap">
    <section class="status-card">
      <div class="status-grid">
        <div>
          <div class="status-eyebrow">MMRC · страница не найдена</div>
          <h1>404</h1>
          <p>
            Такой страницы нет или ссылка устарела. Проверь адрес либо вернитесь на главную.
          </p>
          <div class="status-actions">
            <a class="status-pill primary" href="/">На главную</a>
          </div>
        </div>
        <div class="status-icon-panel" aria-hidden="true">
          <div class="status-number">404</div>
        </div>
      </div>
      <div class="status-footer">
        <span>Если вы ждали контент, проверьте правильность пути или устройство-источник.</span>
      </div>
    </section>
  </div>
</body>
</html>
