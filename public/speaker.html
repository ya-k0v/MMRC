<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
  <title>MMRC Speaker</title>
  
  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  
  <!-- PWA Support -->
  <link rel="manifest" href="/manifest-speaker.json"/>
  <meta name="theme-color" content="#3b82f6"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="MMRC Speaker"/>
  
  <link rel="stylesheet" href="/css/app.css"/>
  <link rel="stylesheet" href="/css/tablet-improvements.css"/>
  <link rel="stylesheet" href="/css/speaker.css"/>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/speaker.js"></script>
</head>
<body class="maintenance-ui speaker-page">
  <header class="toolbar">
    <div class="toolbar-row grow">
      <button id="themeBtn" class="meta toolbar-icon-btn" type="button" aria-label="Переключить тему"></button>
      <strong class="meta">Панель спикера</strong>
      <div class="toolbar-user">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span id="userFullName" class="meta toolbar-link"></span>

        <span class="meta toolbar-separator">•</span>
        <span id="logoutBtn" class="meta toolbar-link">Выйти</span>
      </div>
      <div class="toolbar-spacer"></div>
      <button id="uploadBtn" class="meta speaker-upload-btn" type="button" style="display:none" title="Добавить файлы на устройство">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="block-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Добавить файлы</span>
      </button>
      <button id="launchAndroidBtn" class="meta android-launch-btn" type="button" style="display:none" title="Запустить Android-приложение">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="block-icon"><polygon points="6,4 20,12 6,20"></polygon></svg>
      </button>
    </div>
  </header>

  <main class="speaker-layout">
    <aside class="sidebar panel devices-panel">
      <div class="header panel-header">
        <h3 class="title panel-title">Устройства</h3>
        <div class="meta panel-meta" id="devicesMeta">0</div>
      </div>
      <div class="panel-body-column">
        <ul id="tvList" class="list list-flex"></ul>
        <div id="tvPager" class="meta pager-row"></div>
      </div>
    </aside>
    <section class="speaker-main">
      <div class="panel files-panel panel-body-column">
        <div class="header panel-header">
          <div class="mode-switch">
            <div id="filesModeSwitch" class="mode-switch">
              <button id="filesModeDevice" class="secondary" type="button">Файлы на устройстве</button>
              <button id="filesModeAll" class="secondary" type="button">Все файлы</button>
            </div>
          </div>
          <div class="meta panel-meta" id="filesPaneMeta">Выберите устройство слева</div>
        </div>
        <div class="panel-body-column">
          <ul id="fileList" class="list list-flex"></ul>
          <div id="filePager" class="meta pager-row"></div>
        </div>
      </div>
      <div class="panel preview-panel">
        <h3 class="title">Превью</h3>
        <div id="previewPlaybackInfo" class="meta preview-playback-info"></div>
        <div id="videoProgressContainer" class="video-progress">
          <input type="range" id="videoProgressBar" min="0" max="100" step="0.1" value="0" />
        </div>
        <div id="filePreview" class="miniPreview"></div>
        <div class="preview-controls">
          <button id="pdfPrevBtn" class="secondary" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-icon"><polyline points="15 18 9 12 15 6"/></svg> Назад</button>
          <button id="pdfNextBtn" class="secondary" type="button">Вперёд <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-icon"><polyline points="9 18 15 12 9 6"/></svg></button>
          <button id="pdfCloseBtn" class="danger" type="button" aria-label="Закрыть"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="inline-icon"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="volume-panel" id="volumePanel">
          <div class="volume-slider-row">
            <input type="range" id="volumeSlider" min="0" max="100" step="5" value="50" disabled />
            <div class="volume-value" id="volumeLevelLabel">--%</div>
            <button id="volumeMuteBtn" class="secondary" type="button" disabled>
              <span class="volume-btn-icon" aria-hidden="true"><svg class="volume-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15H8.5L13 19V5L8.5 9H5V15Z"/><circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></span>
            </button>
          </div>
          <div class="player-controls" id="playerControls">
            <button id="playBtn" class="primary" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="inline-icon"><polygon points="6,3 20,12 6,21"/></svg> Play</button>
            <button id="pauseBtn" class="secondary" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="inline-icon"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg> Pause</button>
            <button id="restartBtn" class="secondary" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-icon"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> Restart</button>
            <button id="stopBtn" class="danger" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="inline-icon"><rect x="6" y="6" width="12" height="12" rx="1"/></svg> Stop</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Добавить файлы</h3>
        <button id="uploadModalClose" class="meta icon-btn" type="button" aria-label="Закрыть"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="inline-icon"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">

        <div class="dropZone" id="uploadDropZone">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="dropZone-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <p class="dropZone-title">Перетащите файлы сюда</p>
          <p class="dropZone-hint">или нажмите для выбора</p>
          <input type="file" id="uploadFileInput" multiple style="display:none" accept=".mp4,.webm,.ogg,.mkv,.mov,.avi,.mp3,.wav,.m4a,.png,.jpg,.jpeg,.gif,.webp,.pdf,.pptx,.zip" />
        </div>
        <div id="uploadQueue" class="upload-queue" style="display:none"></div>
        <div id="uploadProgress" class="upload-progress" style="display:none">
          <div class="upload-progress-row">
            <span id="uploadProgressText">Загрузка...</span>
            <span id="uploadProgressPercent">0%</span>
          </div>
          <div class="upload-progress-track">
            <div id="uploadProgressBar" class="upload-progress-bar"></div>
          </div>
        </div>
        <div id="uploadStatus" class="meta upload-status"></div>
      </div>
      <div class="modal-footer">
        <button id="uploadClearBtn" class="secondary" type="button">Очистить</button>
        <button id="uploadSubmitBtn" class="primary" type="button" disabled>Загрузить</button>
      </div>
    </div>
  </div>
</body>
</html>
