<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
  <title>MMRC сервис перегружен</title>
  <link rel="stylesheet" href="/css/status.css"/>
</head>
<body class="status-503">
  <div class="status-wrap">
    <section class="status-card">
      <div class="status-grid">
        <div>
          <div class="status-eyebrow">MMRC · сервис перегружен</div>
          <h1>503</h1>
          <p>
            Сервис временно недоступен: запрос не успел обработаться либо идёт
            обновление. Обычно это несколько секунд — попробуйте ещё раз.
          </p>
          <div class="status-actions">
            <button class="status-pill primary" type="button" id="retry">Повторить</button>
            <a class="status-pill" href="/">На главную</a>
          </div>
        </div>
        <div class="status-icon-panel" aria-hidden="true">
          <div class="status-number">503</div>
        </div>
      </div>
      <div class="status-footer">
        <span id="hint">Автоматическая перезагрузка через <span id="countdown">5</span> с</span>
      </div>
    </section>
  </div>
  <script>
    (function () {
      var LEFT = 5;
      var el = document.getElementById('countdown');
      var timer = setInterval(function () {
        LEFT -= 1;
        if (el) el.textContent = String(LEFT > 0 ? LEFT : 0);
        if (LEFT <= 0) {
          clearInterval(timer);
          location.reload();
        }
      }, 1000);

      document.getElementById('retry').addEventListener('click', function () {
        clearInterval(timer);
        location.reload();
      });
    })();
  </script>
</body>
</html>
