<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
  <title>MMRC Analytics</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest-admin.json"/>
  <meta name="theme-color" content="#3b82f6"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="MMRC Analytics"/>
  <link rel="stylesheet" href="/css/app.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script type="module" src="/js/analytics.js"></script>
</head>
<body class="maintenance-ui admin-page analytics-page">
  <header class="toolbar">
    <div class="toolbar-row">
      <button id="themeBtn" class="meta toolbar-icon-btn" type="button" aria-label="Переключить тему"></button>
      <strong class="meta">Аналитика</strong>
      <div class="toolbar-user">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span id="userFullName" class="meta toolbar-link"></span>
        <span class="meta toolbar-separator">•</span>
        <span id="logoutBtn" class="meta toolbar-link">Выйти</span>
      </div>
    </div>
    <div class="refresh-controls">
      <span id="lastUpdated" class="meta">—</span>
      <button id="refreshBtn" class="meta" type="button">Обновить</button>
      <button id="adminBtn" class="meta" type="button">Админка</button>
    </div>
  </header>

  <div id="app">
    <div class="section-title">Загрузка...</div>
  </div>
</body>
</html>
