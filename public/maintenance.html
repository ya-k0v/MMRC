<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
  <title>MMRC запускается</title>
  <link rel="stylesheet" href="/css/status.css"/>
</head>
<body class="status-maintenance">
  <div class="status-wrap">
    <section class="status-card">
      <div class="status-grid">
        <div>
          <div class="status-eyebrow">MMRC · запуск сервера</div>
          <div class="status-actions">
            <div class="status-pill"><span class="status-dot"></span> Ожидание готовности</div>
          </div>
        </div>
        <div class="status-loader" aria-hidden="true">
          <div class="status-ring"></div>
        </div>
      </div>
      <div class="status-footer">
        <span id="lastCheck">Проверка...</span>
      </div>
    </section>
  </div>
  <script>
    const lastCheck = document.getElementById('lastCheck');
    if (lastCheck) {
      lastCheck.textContent = 'Автообновление включено';
    }
  </script>
</body>
</html>
