# MMRC High-Availability Override
# Usage: docker compose -f docker-compose.deploy.yml -f docker-compose.ha.yml up -d
# Requires: Redis (default), S3/MinIO profile (recommended for shared storage)
#   docker compose -f docker-compose.deploy.yml -f docker-compose.ha.yml --profile s3 up -d
#
# IMPORTANT: HA requires --profile postgres for the database.
# SQLite (default) has concurrent-write limitations and WILL break with >1 replica.
#   docker compose -f docker-compose.deploy.yml -f docker-compose.ha.yml --profile s3 --profile postgres up -d
# Scale replicas: docker compose -f docker-compose.deploy.yml -f docker-compose.ha.yml up -d --scale mmrc-replica=3

services:
  mmrc:
    ports: []

  mmrc-replica:
    image: ${DOCKER_IMAGE:-pingwin1900/mmrc}:${DOCKER_IMAGE_TAG:-v340}
    container_name: mmrc-replica
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-12h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-30d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SILENT_CONSOLE=${SILENT_CONSOLE:-false}
      - MMRC_DATA_DIR=/app/data
      - CONTENT_ROOT=/app/data
      - STREAMS_OUTPUT_DIR=/app/data/streams
      - HOST_DATA_DIR=${HOST_DATA_DIR:-/opt/mmrc/data}
      - CONVERTER_IMAGE=${CONVERTER_IMAGE:-pingwin1900/mmrc-converter}
      - FFMPEG_IMAGE=${FFMPEG_IMAGE:-pingwin1900/mmrc-ffmpeg}
      - LOGS_DIR=/app/data/logs
      - WAL_CHECKPOINT_INTERVAL_MS=${WAL_CHECKPOINT_INTERVAL_MS:-300000}
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=${DB_HOST:-mmrc-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-mmrc}
      - DB_USER=${DB_USER:-mmrc}
      - DB_PASSWORD=${DB_PASSWORD:-mmrc}
      - MMRC_DOCKER=1
      - MMRC_COMPOSE_DIR=/host
      - DOCKER_IMAGE=${DOCKER_IMAGE:-pingwin1900/mmrc}
      - DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG:-v340}
      - REDIS_URL=${REDIS_URL:-redis://mmrc-redis:6379}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://mmrc-minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-mmrc}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
    expose:
      - "80"
      - "3000"
    volumes:
      - ${CONTENT_DIR:-./data}:/app/data
      - mmrc-config:/app/config
      - mmrc-temp:/app/.tmp
      - mmrc-certs:/etc/nginx/ssl-certs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      mmrc-network:
        aliases:
          - mmrc-replica

  nginx-ha:
    image: nginx:alpine
    container_name: mmrc-nginx-ha
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/ha-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - mmrc-certs:/etc/nginx/ssl:ro
    depends_on:
      mmrc-replica:
        condition: service_healthy
    networks:
      - mmrc-network

volumes:
  mmrc-config:
  mmrc-temp:
  mmrc-certs:
