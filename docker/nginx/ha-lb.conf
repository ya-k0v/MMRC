map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format upstream '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream="$upstream_addr" rt="$upstream_response_time"';

# Docker embedded DNS (127.0.0.11) — резолвинг имени сервиса при каждом запросе,
# чтобы масштабирование реплик работало без перезапуска nginx (item HA/resolver)
resolver 127.0.0.11 valid=10s ipv6=off;
set $mmrc_upstream http://mmrc-replica;

server {
    listen 80;
    server_name _;

    client_max_body_size 5120M;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass $mmrc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_read_timeout 86400s;
    }

    location /streams/ {
        proxy_pass $mmrc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }
}

