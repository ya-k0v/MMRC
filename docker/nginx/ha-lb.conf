map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Куда отдавать 503. Для навигации браузера — красивая страница public/503.html.
# Для картинок HTML бесполезен: <img> никогда не отрисует body, поэтому такие
# запросы получают короткий ответ вместо ~7 КБ разметки. Иначе сломанная
# миниатюра превращается в «битую картинку» с полной страницей ошибки.
map $http_accept $mmrc_error_page_503 {
    default        /503.html;
    "~*image"      /503.empty;
}

log_format upstream '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream="$upstream_addr" rt="$upstream_response_time"';

# Docker embedded DNS (127.0.0.11) — резолвинг имени сервиса при каждом запросе,
# чтобы масштабирование реплик работало без перезапуска nginx (item HA/resolver)
resolver 127.0.0.11 valid=10s ipv6=off;
set $mmrc_upstream http://mmrc-replica;

server {
    listen 80;
    server_name _;

    client_max_body_size 5120M;
    access_log /var/log/nginx/access.log upstream;

    # Страницы ошибок. Раньше public/403.html, public/404.html и
    # maintenance.html были просто файлами — на них никто не ссылался, и они
    # не показывались никогда. Файлы отдаёт бэкенд через location /.
    error_page 503 =503 $mmrc_error_page_503;
    error_page 502 504 /maintenance.html;
    # ВАЖНО: proxy_intercept_errors намеренно НЕ включается. Он подменял бы
    # JSON-ответы API и тело ошибок для <img> на HTML, после чего клиент
    # падал бы на res.json(), а картинка получала бы страницу с номером.
    # Ошибки самого приложения разбирает бэкенд с проверкой Accept.

    location / {
        proxy_pass $mmrc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_read_timeout 86400s;
    }

    location /streams/ {
        proxy_pass $mmrc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }
}

