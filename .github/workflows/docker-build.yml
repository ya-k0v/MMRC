name: Docker Build

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [v340, main]
  workflow_dispatch:

env:
  DOCKER_ORG: pingwin1900

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Read version.json
        id: version
        run: |
          echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "branch=$(node -p "require('./version.json').branch")" >> "$GITHUB_OUTPUT"
          echo "dockerTag=$(node -p "require('./version.json').dockerTag")" >> "$GITHUB_OUTPUT"

      - name: Determine branch context
        id: branch
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CodeQL
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          for i in $(seq 60); do
            conclusions=$(gh api "/repos/${{ github.repository }}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Security")) | .conclusion]')
            if [ "$conclusions" = "[]" ] || [ -z "$conclusions" ]; then
              echo "CodeQL not yet finished, waiting... ($((i * 10))s)"
              sleep 10
              continue
            fi
            failed=$(echo "$conclusions" | jq -r '.[] | select(. != "success" and . != "neutral")')
            if [ -n "$failed" ]; then
              echo "CodeQL failed: $failed"
              exit 1
            fi
            echo "CodeQL passed: $conclusions"
            exit 0
          done
          echo "Timed out waiting for CodeQL"
          exit 1

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable=${{ steps.branch.outputs.is_main }}

      - name: Docker metadata (converter)
        id: meta-converter
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc-converter
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable=${{ steps.branch.outputs.is_main }}

      - name: Docker metadata (ffmpeg)
        id: meta-ffmpeg
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc-ffmpeg
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable=${{ steps.branch.outputs.is_main }}

      - name: Docker metadata (streamer)
        id: meta-streamer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc-streamer
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable=${{ steps.branch.outputs.is_main }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            INCLUDE_DOCKER_CLI=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push converter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.converter
          push: true
          tags: ${{ steps.meta-converter.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ffmpeg
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg
          push: true
          tags: ${{ steps.meta-ffmpeg.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push streamer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.streamer
          push: true
          tags: ${{ steps.meta-streamer.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
