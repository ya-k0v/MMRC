name: Docker Build

on:
  push:
    branches: [v340, main]
  workflow_dispatch:

env:
  DOCKER_ORG: pingwin1900

jobs:
  ci:
    uses: ./.github/workflows/app-test.yml
    secrets: inherit

  codeql:
    uses: ./.github/workflows/security-codeql.yml
    secrets: inherit
    permissions:
      actions: read
      security-events: write
      contents: read

  build:
    needs: [ci, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version.json
        id: version
        run: |
          echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "dockerTag=$(node -p "require('./version.json').dockerTag")" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (converter)
        id: meta-converter
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc-converter
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (ffmpeg)
        id: meta-ffmpeg
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc-ffmpeg
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (streamer)
        id: meta-streamer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/mmrc-streamer
          tags: |
            type=raw,value=${{ steps.version.outputs.dockerTag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            INCLUDE_DOCKER_CLI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push converter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.converter
          push: true
          tags: ${{ steps.meta-converter.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ffmpeg
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg
          push: true
          tags: ${{ steps.meta-ffmpeg.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push streamer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.streamer
          push: true
          tags: ${{ steps.meta-streamer.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
