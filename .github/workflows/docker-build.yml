name: Docker Build

on:
  push:
    branches: [v340, main]
  workflow_dispatch:

env:
  DOCKER_ORG: pingwin1900

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version.json
        id: version
        run: |
          echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"
          echo "branch=$(node -p "require('./version.json').branch")" >> "$GITHUB_OUTPUT"
          echo "dockerTag=$(node -p "require('./version.json').dockerTag")" >> "$GITHUB_OUTPUT"

      - name: Generate tags
        id: tags
        run: |
          TAG="${{ steps.version.outputs.dockerTag }}"
          ORG="${{ env.DOCKER_ORG }}"
          IS_MAIN=${{ github.ref_name == 'main' }}

          tags_for() {
            local image=$1
            echo "${ORG}/${image}:${TAG}"
            [ "$IS_MAIN" = "true" ] && echo "${ORG}/${image}:latest"
          }

          # Delimiter-based multiline output
          delimiter_server="TAGS$(date +%s%N)"
          echo "server<<${delimiter_server}" >> "$GITHUB_OUTPUT"
          tags_for "mmrc" >> "$GITHUB_OUTPUT"
          echo "${delimiter_server}" >> "$GITHUB_OUTPUT"

          delimiter_converter="TAGS$(date +%s%N)"
          echo "converter<<${delimiter_converter}" >> "$GITHUB_OUTPUT"
          tags_for "mmrc-converter" >> "$GITHUB_OUTPUT"
          echo "${delimiter_converter}" >> "$GITHUB_OUTPUT"

          delimiter_ffmpeg="TAGS$(date +%s%N)"
          echo "ffmpeg<<${delimiter_ffmpeg}" >> "$GITHUB_OUTPUT"
          tags_for "mmrc-ffmpeg" >> "$GITHUB_OUTPUT"
          echo "${delimiter_ffmpeg}" >> "$GITHUB_OUTPUT"

          delimiter_streamer="TAGS$(date +%s%N)"
          echo "streamer<<${delimiter_streamer}" >> "$GITHUB_OUTPUT"
          tags_for "mmrc-streamer" >> "$GITHUB_OUTPUT"
          echo "${delimiter_streamer}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.server }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            INCLUDE_DOCKER_CLI=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push converter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.converter
          push: true
          tags: ${{ steps.tags.outputs.converter }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ffmpeg
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ffmpeg
          push: true
          tags: ${{ steps.tags.outputs.ffmpeg }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push streamer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.streamer
          push: true
          tags: ${{ steps.tags.outputs.streamer }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
