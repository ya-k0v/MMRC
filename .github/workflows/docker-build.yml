name: Build and Push Docker Image

on:
  push:
    branches: [ v330, main ]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/app-test.yml
    secrets: inherit

  codeql:
    uses: ./.github/workflows/security-codeql.yml
    secrets: inherit
    permissions:
      actions: read
      security-events: write
      contents: read

  build:
    needs: [ci, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Derive Docker tag
        id: tags
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            echo "tags=pingwin1900/mmrc:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=pingwin1900/mmrc:$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            INCLUDE_DOCKER_CLI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
