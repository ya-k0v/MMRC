name: Build and Push Converter Image

on:
  push:
    branches: [ v340, main ]
    paths:
      - Dockerfile.converter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/app-test.yml
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Derive Docker tag
        id: tags
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            echo "tags=pingwin1900/mmrc-converter:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=pingwin1900/mmrc-converter:$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Converter image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.converter
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
